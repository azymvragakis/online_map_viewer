                            <div style="font-size: 10px; color: #6c757d; margin-top: 3px;">Hold Ctrl/Cmd to select multiple</div>`;
                    } else {
                        inputHTML = `<textarea id="filterValueList_${filterId}" placeholder="Enter values separated by commas" style="height: 60px; resize: vertical;">${existingFilter?.values?.join(', ') || ''}</textarea>`;
                    }
                    break;

                case 'contains':
                    inputHTML = `<input type="text" id="filterValueContains_${filterId}" placeholder="Text to search for" value="${existingFilter?.value || ''}">`;
                    break;
            }

            valueContainer.innerHTML = inputHTML;
        }

        // Apply all filters to the active layer
        async function applyMultiFilter() {
            if (activeLayerId === null) {
                alert('Please select a layer first!');
                return;
            }

            const layer = layers[activeLayerId];
            const totalFeatures = layer.originalData.features.length;
            
            // Show performance warning for large datasets
            if (totalFeatures > 50000) {
                let warningMessage;
                if (layer.extremeMode) {
                    warningMessage = `🚀 EXTREME MODE Dataset!\n\n` +
                        `This layer has ${totalFeatures.toLocaleString()} features with ultra-aggressive optimizations:\n` +
                        `• 16 Web Workers with 16k chunk sizes\n` +
                        `• Ultra-optimized canvas renderer\n` +
                        `• Pre-processed coordinates and properties\n` +
                        `• Expected processing time: 2-4 minutes (improved from 11 minutes)\n\n` +
                        `Recommendations:\n` +
                        `• Use "Preview" first to test your filters\n` +
                        `• Close other browser tabs to maximize CPU/memory\n\n` +
                        `Ready to unleash extreme performance?`;
                } else {
                    warningMessage = `⚠️ Large Dataset Warning!\n\n` +
                        `This layer has ${totalFeatures.toLocaleString()} features.\n` +
                        `Filtering may take several minutes and could freeze the browser.\n\n` +
                        `Recommendations:\n` +
                        `• Use "Preview" first to test your filters\n` +
                        `• Consider adding more specific filter conditions\n` +
                        `• Close other browser tabs to free memory\n\n` +
                        `Do you want to continue?`;
                }
                
                const proceed = confirm(warningMessage);
                
                if (!proceed) return;
            }

            // Show loading indicator
            const loadingIndicator = document.getElementById('filterLoadingIndicator');
            if (loadingIndicator) {
                loadingIndicator.style.display = 'block';
                // Update loading message for large datasets
                if (totalFeatures > 50000) {
                    loadingIndicator.innerHTML = `
                        <div style="display: inline-block; width: 20px; height: 20px; border: 2px solid #007bff; border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; margin-right: 10px;"></div>
                        <span style="color: #004085; font-weight: 600;">Processing ${totalFeatures.toLocaleString()} features... This may take a few minutes.</span>
                    `;
                }
            }

            try {
                // Small delay to show loading indicator
                await new Promise(resolve => setTimeout(resolve, 50));

                const layer = layers[activeLayerId];
                const filterLogic = document.getElementById('filterLogic').value;
                const filterRows = document.querySelectorAll('.filter-row');
                
                // Collect NEW filter conditions from the current filter form
                const newConditions = [];
                
                for (let filterRow of filterRows) {
                    const filterId = filterRow.dataset.filterId;
                    const condition = collectFilterCondition(filterId);
                    
                    if (condition) {
                        newConditions.push(condition);
                    }
                }

                if (newConditions.length === 0) {
                    alert('Please configure at least one filter condition!');
                    return;
                }

                // Initialize the multiFilters array for this layer if it doesn't exist
                if (!multiFilters[activeLayerId]) {
                    multiFilters[activeLayerId] = [];
                }

                // Add new conditions to existing ones (cumulative filtering)
                multiFilters[activeLayerId].push(...newConditions);

                // Use ALL conditions (existing + new) for filtering
                const conditions = [...multiFilters[activeLayerId]];

                if (conditions.length === 0) {
                    alert('Please configure at least one filter condition!');
                    return;
                }

                // Apply filters
                const totalFeatures = layer.originalData.features.length;
                const features = layer.originalData.features;
                let results = [];
                let matchingFeatures = 0;

                // Use Web Workers for large datasets (>50000 features) - optimized for AMD Ryzen 5 4600H
                if (totalFeatures > 50000 && window.Worker) {
                    console.log(`Using Web Workers for ${totalFeatures} features`);
                    
                    try {
                        const progressCallback = (progress, matchingCount, processedFeatures, totalFeatures, timeLeft) => {
                            console.log(`Processing: ${processedFeatures.toLocaleString()} / ${totalFeatures.toLocaleString()} events (${matchingCount} matches, ${timeLeft} remaining)`);
                            // Update loading indicator with real-time event count and time estimate while preserving stop button
                            if (loadingIndicator) {
                                loadingIndicator.innerHTML = `
                                    <div style="display: inline-block; width: 20px; height: 20px; border: 2px solid #007bff; border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; margin-right: 10px;"></div>
                                    <span style="color: #004085; font-weight: 600;">Processing batch ${Math.ceil(processedFeatures / 20000)} - Found ${matchingCount} matches so far...</span>
                                `;
                            }
                        };

                        // Check if this is the extreme mode layer (S1234567)
                        const isExtremeMode = layer.extremeMode || false;
                        
                        // Check if this is a split layer (split layers don't need incremental rendering)
                        const isSplitLayer = parseInt(activeLayerId) >= 1000;
                        
                        // INCREMENTAL RENDERING: Only for original large datasets, not split layers
                        const useIncrementalRendering = !isSplitLayer && totalFeatures > 80000;
                        
                        if (useIncrementalRendering) {
                            console.log(`🎯 Using incremental rendering for large dataset (${totalFeatures.toLocaleString()} features)`);
                            const incrementalBatchSize = 20000;
                            let totalProcessed = 0;
                            let allResults = [];
                            let cumulativeMatches = 0;
                            
                            console.log(`🎯 Starting incremental processing in batches of ${incrementalBatchSize.toLocaleString()}`);
                            
                            for (let batchStart = 0; batchStart < features.length; batchStart += incrementalBatchSize) {
                            const batchEnd = Math.min(batchStart + incrementalBatchSize, features.length);
                            const batchFeatures = features.slice(batchStart, batchEnd);
                            
                            console.log(`📦 Processing batch ${Math.ceil(batchStart / incrementalBatchSize) + 1}: features ${batchStart.toLocaleString()}-${batchEnd.toLocaleString()}`);
                            
                            // Process this batch
                            const batchResult = await processFilteringWithWorker(batchFeatures, conditions, filterLogic, progressCallback, isExtremeMode);
                            const batchResults = batchResult.results;
                            const batchMatches = batchResult.totalMatching;
                            
                            // Convert batch results to expected format
                            const batchFormattedResults = batchFeatures.map((feature, index) => ({
                                feature,
                                matches: batchResults[index],
                                featureIndex: batchStart + index
                            }));
                            
                            // Add to cumulative results
                            allResults.push(...batchFormattedResults);
                            cumulativeMatches += batchMatches;
                            totalProcessed = batchEnd;
                            
                            // 🎯 INCREMENTAL RENDERING: Show results immediately
                            console.log(`✨ Rendering batch ${Math.ceil(batchStart / incrementalBatchSize) + 1} with ${batchMatches} new matches (${cumulativeMatches} total)`);
                            
                            // Update layer with partial results and render immediately
                            layer.multiFilterResults = allResults;
                            layer.isFiltered = true;
                            layer.filterType = 'multi';
                            layer.matchingCount = cumulativeMatches;
                            
                            // Re-create layer with current results (this shows the aqua circles immediately)
                            createLayer(activeLayerId);
                            updateInfo();
                            
                            // Update progress display
                            if (loadingIndicator) {
                                loadingIndicator.innerHTML = `
                                    <div style="display: inline-block; width: 20px; height: 20px; border: 2px solid #007bff; border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; margin-right: 10px;"></div>
                                    <span style="color: #004085; font-weight: 600;">Batch ${Math.ceil(batchEnd / incrementalBatchSize)} complete - ${cumulativeMatches.toLocaleString()} matches visible! (${totalProcessed.toLocaleString()}/${features.length.toLocaleString()} processed)</span>
                                `;
                            }
                            
                            // Small delay to allow UI to update
                            await new Promise(resolve => setTimeout(resolve, 100));
                        }
                        
                            results = allResults;
                            matchingFeatures = cumulativeMatches;
                            
                            console.log(`🎉 Incremental processing complete! Total: ${matchingFeatures.toLocaleString()} matches from ${features.length.toLocaleString()} features`);
                        } else {
                            // STANDARD PROCESSING: For split layers and smaller datasets
                            console.log(`🚀 Using standard processing for ${isSplitLayer ? 'split layer' : 'normal dataset'} (${totalFeatures.toLocaleString()} features)`);
                            
                            const workerResult = await processFilteringWithWorker(features, conditions, filterLogic, progressCallback, isExtremeMode);
                            const workerResults = workerResult.results;
                            matchingFeatures = workerResult.totalMatching;

                            // Convert worker results to expected format with index for fast lookup
                            results = features.map((feature, index) => ({
                                feature,
                                matches: workerResults[index],
                                featureIndex: index
                            }));
                        }

                        console.log(`Web Worker processing complete: ${matchingFeatures} matches found`);
                    } catch (error) {
                        console.error('Web Worker failed, falling back to main thread:', error);
                        // Fall back to main thread processing
                        results = await processFilteringMainThread(features, conditions, filterLogic);
                        matchingFeatures = results.filter(r => r.matches).length;
                    }
                } else {
                    // Process on main thread for smaller datasets or if Web Workers unavailable
                    console.log(`Processing ${totalFeatures} features on main thread`);
                    
                    const mainThreadProgressCallback = (progress, matchingCount, processedFeatures, totalFeatures, timeLeft) => {
                        console.log(`Main thread processing: ${processedFeatures.toLocaleString()} / ${totalFeatures.toLocaleString()} events (${matchingCount} matches)`);
                        if (loadingIndicator) {
                            loadingIndicator.innerHTML = `
                                <div style="display: inline-block; width: 20px; height: 20px; border: 2px solid #007bff; border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; margin-right: 10px;"></div>
                                <span style="color: #004085; font-weight: 600;">Processing batch ${Math.ceil(processedFeatures / 20000)} - Found ${matchingCount} matches so far...</span>
                            `;
                        }
                    };
                    
                    results = await processFilteringMainThread(features, conditions, filterLogic, mainThreadProgressCallback);
                    matchingFeatures = results.filter(r => r.matches).length;
                }

                // For incremental rendering, final results are already stored during processing
                // Just ensure the final state is properly set
                if (!layer.multiFilterResults) {
                    layer.multiFilterResults = results;
                    layer.isFiltered = true;
                    layer.filterType = 'multi';
                    layer.matchingCount = matchingFeatures;
                    
                    // Final render for non-incremental processing
                    createLayer(activeLayerId);
                }
                
                renderLayerList();
                updateInfo();
                updatePersistentFilterDisplay();

                // Clear the filter form so users can add more filters
                initializeMultiFilter();

                // Show completion message
                const completionMessage = layer.extremeMode 
                    ? `🚀 EXTREME MODE Complete!\n\nIncremental processing finished:\n• ${matchingFeatures.toLocaleString()} matches found\n• Results rendered in real-time batches\n• All ${totalFeatures.toLocaleString()} features processed`
                    : `Multi-filter applied! Found ${matchingFeatures.toLocaleString()} of ${totalFeatures.toLocaleString()} matching features.`;
                    
                alert(completionMessage);

            } catch (error) {
                console.error('Filter application error:', error);
                if (error.message !== 'Filtering stopped by user') {
                    alert('Error applying filters. Check console for details.');
                }
            } finally {
                // Clean up state
                isFilteringActive = false;
                activeFilteringWorkers.forEach(w => w.terminate());

        // Collect filter condition from a filter row
        function collectFilterCondition(filterId) {
            const column = document.getElementById(`filterColumn_${filterId}`)?.value;
            const filterType = document.getElementById(`filterType_${filterId}`)?.value;
            const operator = document.getElementById(`filterOperator_${filterId}`)?.value;

            if (!column) return null;

            const condition = {
                id: parseInt(filterId),
                column,
                type: filterType,
                operator
            };

            // Collect values based on filter type
            switch (filterType) {
                case 'single':
                    let singleValue;
                    const singleInput = document.getElementById(`filterValue_${filterId}`);
                    const valueContainer = document.getElementById(`valueContainer_${filterId}`);
                    
                    if (singleInput) {
                        singleValue = singleInput.value;
                    } else if (valueContainer?._searchableDropdown) {
                        singleValue = valueContainer._searchableDropdown.getValue();
                    }
                    
                    if (!singleValue && singleValue !== 0) return null;
                    condition.value = singleValue;
                    break;

                case 'range':
                    const minValue = document.getElementById(`filterValueMin_${filterId}`)?.value;
                    const maxValue = document.getElementById(`filterValueMax_${filterId}`)?.value;
                    if (!minValue && !maxValue) return null;
                    condition.valueMin = minValue ? parseFloat(minValue) : -Infinity;
                    condition.valueMax = maxValue ? parseFloat(maxValue) : Infinity;
                    break;

                case 'list':
                    const listElement = document.getElementById(`filterValueList_${filterId}`);
                    let values = [];
                    
                    if (listElement.tagName === 'SELECT') {
                        values = Array.from(listElement.selectedOptions).map(opt => opt.value);
                    } else {
                        values = listElement.value.split(',').map(v => v.trim()).filter(v => v);
                    }
                    
                    if (values.length === 0) return null;
                    condition.values = values;
                    break;

                case 'contains':
                    const containsValue = document.getElementById(`filterValueContains_${filterId}`)?.value;
                    if (!containsValue) return null;
                    condition.value = containsValue;
                    break;

                default:
                    return null;
            }

            return condition;
        }

            console.log(`[FILTER DEBUG] Evaluating feature:`, feature.properties);

            if (conditions.length === 0) {

                    case 'range':

                        console.log(`[FILTER DEBUG] Range condition: ${numValue} in [${condition.valueMin}, ${condition.valueMax}] = ${result}`);

            console.log(`[FILTER DEBUG] Individual results:`, results);

        // Evaluate single condition with operator
        function evaluateSingleCondition(propValue, operator, filterValue) {
            // Try numeric comparison first
            const numProp = parseFloat(propValue);
            const numFilter = parseFloat(filterValue);
            
            if (!isNaN(numProp) && !isNaN(numFilter)) {
                switch (operator) {
                    case '>=': return numProp >= numFilter;
                    case '<=': return numProp <= numFilter;
                    case '=': return numProp === numFilter;
                    case '>': return numProp > numFilter;
                    case '<': return numProp < numFilter;
                    case '!=': return numProp !== numFilter;
                    default: return false;
                }
            } else {
                // String comparison
                const strProp = String(propValue);
                const strFilter = String(filterValue);
                
                switch (operator) {
                    case '=': return strProp === strFilter;
                    case '!=': return strProp !== strFilter;
                    case '>=': return strProp >= strFilter;
                    case '<=': return strProp <= strFilter;
                    case '>': return strProp > strFilter;
                    case '<': return strProp < strFilter;
                    default: return false;
                }
            }
        }

        function createSearchableDropdown(containerId, options, placeholder = "Type to search...", onSelect = null) {
            const container = document.getElementById(containerId);
            if (!container) return null;

            const dropdown = document.createElement('div');
            dropdown.className = 'searchable-dropdown';
            dropdown.innerHTML = `
                <input type="text" placeholder="${placeholder}" autocomplete="off">
                <div class="searchable-dropdown-list"></div>
            `;

            const input = dropdown.querySelector('input');
            const list = dropdown.querySelector('.searchable-dropdown-list');
            let filteredOptions = [...options];
            let selectedIndex = -1;

            function renderOptions(searchTerm = '') {
                filteredOptions = options.filter(option => 
                    option.toLowerCase().includes(searchTerm.toLowerCase())
                );

                list.innerHTML = '';
                selectedIndex = -1;

                if (filteredOptions.length === 0) {
                    list.innerHTML = '<div class="searchable-dropdown-item" style="color: #6c757d; cursor: default;">No matches found</div>';
                } else {
                    filteredOptions.slice(0, 100).forEach((option, index) => { // Limit to 100 for performance
                        const item = document.createElement('div');
                        item.className = 'searchable-dropdown-item';
                        item.textContent = option;
                        item.onclick = () => selectOption(option);
                        list.appendChild(item);
                    });

                    if (filteredOptions.length > 100) {
                        const moreItem = document.createElement('div');
                        moreItem.className = 'searchable-dropdown-item';
                        moreItem.style.color = '#6c757d';
                        moreItem.style.fontStyle = 'italic';
                        moreItem.textContent = `... and ${filteredOptions.length - 100} more. Keep typing to narrow down.`;
                        list.appendChild(moreItem);
                    }
                }
            }

            function selectOption(value) {
                input.value = value;
                list.style.display = 'none';
                if (onSelect) onSelect(value);
            }

            function showList() {
                if (filteredOptions.length > 0) {
                    list.style.display = 'block';
                }
            }

            function hideList() {
                setTimeout(() => {
                    list.style.display = 'none';
                }, 150);
            }

            // Event listeners
            input.addEventListener('input', (e) => {
                renderOptions(e.target.value);
                showList();
            });

            input.addEventListener('focus', showList);
            input.addEventListener('blur', hideList);

            input.addEventListener('keydown', (e) => {
                const items = list.querySelectorAll('.searchable-dropdown-item:not([style*="italic"])');
                
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
                    updateSelection(items);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    selectedIndex = Math.max(selectedIndex - 1, -1);
                    updateSelection(items);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (selectedIndex >= 0 && items[selectedIndex]) {
                        selectOption(items[selectedIndex].textContent);
                    }
                } else if (e.key === 'Escape') {
                    list.style.display = 'none';
                }
            });

            function updateSelection(items) {
                items.forEach((item, index) => {
                    item.classList.toggle('selected', index === selectedIndex);
                });
            }

            // Initialize
            renderOptions();
            container.innerHTML = '';
            container.appendChild(dropdown);

            return {
                getValue: () => input.value,
                setValue: (value) => { input.value = value; },
                destroy: () => container.removeChild(dropdown)
            };
        }

        // ===============================

        function createFilterWorker() {
            const workerCode = `
                // Feature matching function for Web Worker
                function featureMatchesFilter(feature, conditions, logic) {
                    if (conditions.length === 0) return true;

                    const results = conditions.map(condition => {
                        const propValue = feature.properties[condition.column];
                        
                        switch (condition.type) {
                            case 'single':
                                return evaluateSingleCondition(propValue, condition.operator, condition.value);
                            
                            case 'range':
                                const numValue = parseFloat(propValue);
                                return !isNaN(numValue) && numValue >= condition.valueMin && numValue <= condition.valueMax;
                            
                            case 'list':
                                return condition.values.includes(String(propValue));
                            
                            case 'contains':
                                return String(propValue).toLowerCase().includes(condition.value.toLowerCase());
                            
                            default:
                                return false;
                        }
                    });

                    return logic === 'AND' ? results.every(r => r) : results.some(r => r);
                }

                function evaluateSingleCondition(propValue, operator, conditionValue) {
                    const strPropValue = String(propValue);
                    const strConditionValue = String(conditionValue);
                    const numPropValue = parseFloat(propValue);
                    const numConditionValue = parseFloat(conditionValue);
                    
                    const isNumericComparison = !isNaN(numPropValue) && !isNaN(numConditionValue);

                    switch (operator) {
                        case 'equals':
                            return isNumericComparison ? numPropValue === numConditionValue : strPropValue === strConditionValue;
                        case 'not_equals':
                            return isNumericComparison ? numPropValue !== numConditionValue : strPropValue !== strConditionValue;
                        case 'greater_than':
                            return isNumericComparison && numPropValue > numConditionValue;
                        case 'less_than':
                            return isNumericComparison && numPropValue < numConditionValue;
                        case 'greater_equal':
                            return isNumericComparison && numPropValue >= numConditionValue;
                        case 'less_equal':
                            return isNumericComparison && numPropValue <= numConditionValue;
                        case 'contains':
                            return strPropValue.toLowerCase().includes(strConditionValue.toLowerCase());
                        case 'starts_with':
                            return strPropValue.toLowerCase().startsWith(strConditionValue.toLowerCase());
                        case 'ends_with':
                            return strPropValue.toLowerCase().endsWith(strConditionValue.toLowerCase());
                        default:
                            return false;
                    }
                }

                // Message handler
                self.addEventListener('message', function(e) {
                    const { features, conditions, logic, chunkIndex } = e.data;
                    
                    try {
                        const results = features.map(feature => featureMatchesFilter(feature, conditions, logic));
                        const matchingCount = results.filter(r => r).length;
                        
                        self.postMessage({
                            success: true,
                            results,
                            matchingCount,
                            chunkIndex,
                            totalProcessed: features.length
                        });
                    } catch (error) {
                        self.postMessage({
                            success: false,
                            error: error.message,
                            chunkIndex
                        });
                    }
                });
            `;

            const blob = new Blob([workerCode], { type: 'application/javascript' });
            return new Worker(URL.createObjectURL(blob));
        }

        async function processFilteringWithWorker(features, conditions, logic, progressCallback, isExtremeMode = false) {
            return new Promise((resolve, reject) => {
                // Optimize for AMD Ryzen 5 4600H (6 cores/12 threads) + 16GB RAM
                let chunkSize, maxWorkers;
                if (features.length > 100000) {
                    if (isExtremeMode) {
                        // ULTRA-EXTREME mode for S1234567 file (141k features)
                        chunkSize = 16000; // Massive chunks for extreme bulk processing
                        maxWorkers = 16; // Use more workers than CPU threads for I/O bound operations
                        console.log(`🚀 ULTRA-EXTREME MODE: ${chunkSize} chunk size, ${maxWorkers} workers`);
                    } else {
                        // Standard extreme mode for 100k+ datasets
                        chunkSize = 12000; // Much larger chunks for bulk processing
                        maxWorkers = 12; // Use all available threads (6 cores × 2 = 12 threads)
                    }
                } else if (features.length > 50000) {
                    chunkSize = 4000; // Medium chunks for 50k-100k datasets  
                    maxWorkers = 6; // Moderate core usage
                } else {
                    chunkSize = 2000; // Smaller chunks for normal datasets
                    maxWorkers = 4; // Conservative core usage
                }
                
                const chunks = [];
                
                // Split features into chunks
                for (let i = 0; i < features.length; i += chunkSize) {
                    chunks.push(features.slice(i, i + chunkSize));
                }

                const results = new Array(features.length);
                const workers = [];
                let completedChunks = 0;
                let totalMatching = 0;
                let actualProcessedFeatures = 0; // Track actual processed features
                let hasError = false;
                const startTime = Date.now();
                
                // Set filtering state to active
                isFilteringActive = true;
                activeFilteringWorkers = []; // Clear previous workers

                console.log(`Processing ${features.length} features in ${chunks.length} chunks using ${maxWorkers} workers`);
                
                // Show initial progress (0 processed)
                if (progressCallback) {
                    progressCallback(0, 0, 0, features.length, "calculating...");
                }

                function processChunk(chunkIndex) {
                    if (chunkIndex >= chunks.length || hasError || !isFilteringActive) return;

                    const worker = createFilterWorker();
                    workers.push(worker);
                    activeFilteringWorkers.push(worker); // Track for stopping

                    worker.onmessage = function(e) {
                        if (hasError || !isFilteringActive) return;

                        const { success, results: chunkResults, matchingCount, error, totalProcessed } = e.data;

                        if (success) {
                            // Store results in correct position
                            const startIndex = chunkIndex * chunkSize;
                            chunkResults.forEach((result, i) => {
                                results[startIndex + i] = result;
                            });

                            totalMatching += matchingCount;
                            completedChunks++;

                            // Calculate progress based on completed chunks (more reliable)
                            const chunkProgress = (completedChunks / chunks.length) * 100;
                            // Estimate processed features based on completed chunks
                            const estimatedProcessedFeatures = Math.floor((completedChunks / chunks.length) * features.length);
                            
                            const elapsedTime = (Date.now() - startTime) / 1000; // seconds
                            
                            // Avoid division by zero and negative time estimates
                            let estimatedTimeLeft = 0;
                            if (elapsedTime > 0 && completedChunks > 0) {
                                const chunksPerSecond = completedChunks / elapsedTime;
                                const remainingChunks = chunks.length - completedChunks;
                                estimatedTimeLeft = remainingChunks / chunksPerSecond; // seconds
                            }
                            
                            console.log(`[PROGRESS DEBUG] Chunks: ${completedChunks}/${chunks.length} (${chunkProgress.toFixed(1)}%), Est. features: ${estimatedProcessedFeatures}/${features.length}`);
                            
                            // Format time estimation
                            const formatTime = (seconds) => {
                                if (seconds < 60) return `${seconds.toFixed(0)}s`;
                                const minutes = Math.floor(seconds / 60);
                                const secs = Math.floor(seconds % 60);
                                return `${minutes}:${secs.toString().padStart(2, '0')}`;
                            };

                            // Update progress with real event count and time estimate
                            if (progressCallback) {
                                progressCallback(
                                    chunkProgress, 
                                    totalMatching, 
                                    estimatedProcessedFeatures, 
                                    features.length, 
                                    formatTime(estimatedTimeLeft)
                                );
                            }

                            // Check if all chunks are complete
                            if (completedChunks === chunks.length) {
                                // Clean up workers
                                workers.forEach(w => w.terminate());
                                activeFilteringWorkers = []; // Clear tracking array
                                isFilteringActive = false; // Reset state
                                resolve({ results, totalMatching });
                            } else {
                                // Process next chunk with this worker
                                const nextChunkIndex = chunkIndex + maxWorkers;
                                if (nextChunkIndex < chunks.length) {
                                    worker.postMessage({
                                        features: chunks[nextChunkIndex],
                                        conditions,
                                        logic,
                                        chunkIndex: nextChunkIndex
                                    });
                                } else {
                                    worker.terminate();
                                }
                            }
                        } else {
                            hasError = true;
                            workers.forEach(w => w.terminate());
                            activeFilteringWorkers = []; // Clear tracking array
                            isFilteringActive = false; // Reset state
                            reject(new Error(error));
                        }
                    };

                    worker.onerror = function(error) {
                        hasError = true;
                        workers.forEach(w => w.terminate());
                        activeFilteringWorkers = []; // Clear tracking array
                        isFilteringActive = false; // Reset state
                        reject(error);
                    };

                    // Start processing
                    worker.postMessage({
                        features: chunks[chunkIndex],
                        conditions,
                        logic,
                        chunkIndex
                    });
                }

                // Start initial workers
                for (let i = 0; i < Math.min(maxWorkers, chunks.length); i++) {
                    processChunk(i);
                }
            });
        }

        async function processFilteringMainThread(features, conditions, logic, progressCallback = null) {
            const chunkSize = Math.min(2000, Math.max(500, Math.floor(features.length / 10)));
            const results = [];
            const startTime = Date.now();
            let totalMatching = 0;
            
            // Set filtering state to active
            isFilteringActive = true;

            for (let i = 0; i < features.length; i += chunkSize) {
                // Check if filtering was stopped
                if (!isFilteringActive) {
                    console.log('[STOP] Main thread processing stopped');
                    break;
                }
                const chunk = features.slice(i, i + chunkSize);
                
                chunk.forEach((feature, chunkIndex) => {
                    const matches = evaluateFeatureConditions(feature, conditions, logic);
                    if (matches) totalMatching++;
                    results.push({ 
                        feature, 
                        matches, 
                        featureIndex: i + chunkIndex
                    });
                });

                // Update progress for main thread processing
                if (progressCallback && i % (chunkSize * 2) === 0) {
                    const processedFeatures = Math.min(i + chunkSize, features.length);
                    const elapsedTime = (Date.now() - startTime) / 1000;
                    const processingRate = processedFeatures / elapsedTime;
                    const remainingFeatures = features.length - processedFeatures;
                    const estimatedTimeLeft = remainingFeatures / processingRate;
                    
                    const formatTime = (seconds) => {
                        if (seconds < 60) return `${seconds.toFixed(0)}s`;
                        const minutes = Math.floor(seconds / 60);
                        const secs = Math.floor(seconds % 60);
                        return `${minutes}:${secs.toString().padStart(2, '0')}`;
                    };

                    progressCallback(
                        (processedFeatures / features.length) * 100,
                        totalMatching,
                        processedFeatures,
                        features.length,
                        formatTime(estimatedTimeLeft)
                    );
                }

                // Allow UI to update during processing (reduced frequency for performance)
                if (i % (chunkSize * 5) === 0) {
                    await new Promise(resolve => setTimeout(resolve, 1));
                }
            }
            
            // Reset filtering state
            isFilteringActive = false;

            return results;
        }

        // ===============================
        // END WEB WORKER
        // ===============================

        // ===============================
        // END MULTI-ATTRIBUTE FILTERING
        // ===============================
        
        // Populate filter options from active layer (LEGACY - kept for compatibility)
        function populateFilterOptions() {
            const filterColumn = document.getElementById('filterColumn');
            if (!filterColumn) {
                console.log('[DEBUG] Legacy filterColumn element not found - multi-filter system in use');
                return; // Multi-filter system doesn't use this element
            }
            
            filterColumn.innerHTML = '<option value="">-- Select --</option>';
            
            if (activeLayerId === null || !layers[activeLayerId]) return;
            
            // Always use originalData to get all columns
            const layer = layers[activeLayerId];
            
            // Build a map of column names to their types
            // For each column, find the first non-null value to determine the correct type
            const columnTypes = {};
            const firstFeatureProps = layer.originalData.features[0]?.properties || {};
            
            // Initialize all columns from first feature
            for (let key in firstFeatureProps) {
                columnTypes[key] = null; // Will be determined later
            }
            
            // For each column, find first non-null value to determine type
            for (let key in columnTypes) {
                for (let feature of layer.originalData.features) {
                    const value = feature.properties[key];
                    if (value !== null && value !== undefined) {
                        columnTypes[key] = typeof value;
                        break; // Found a non-null value for this column
                    }
                }
                // If all values are null, default to "object"
                if (columnTypes[key] === null) {
                    columnTypes[key] = "object";
                }
            }
            
            // Add ALL columns to dropdown
            for (let key in columnTypes) {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = `${key} (${columnTypes[key]})`;
                option.dataset.type = columnTypes[key];
                filterColumn.appendChild(option);
            }
            
            // Update value input when column changes
            filterColumn.onchange = updateValueInput;
            
            // Reset value inputs when switching layers
            document.getElementById('filterValue').style.display = 'none';
            document.getElementById('filterValueSelect').style.display = 'none';
            document.getElementById('filterValueText').style.display = 'none';
            document.getElementById('filterValue').value = '';
            document.getElementById('filterValueSelect').value = '';
            document.getElementById('filterValueText').value = '';
        }
        
        // Update value input based on selected column type
        function updateValueInput() {
            const filterColumn = document.getElementById('filterColumn');
            const filterOperator = document.getElementById('filterOperator');
            const filterValue = document.getElementById('filterValue');
            const filterValueSelect = document.getElementById('filterValueSelect');
            const filterValueText = document.getElementById('filterValueText');
            
            // Hide all inputs first
            filterValue.style.display = 'none';
            filterValueSelect.style.display = 'none';
            filterValueText.style.display = 'none';
            
            const selectedOption = filterColumn.options[filterColumn.selectedIndex];
            if (!selectedOption || !selectedOption.dataset.type) return;
            
            // Check if we have an active layer
            if (activeLayerId === null || !layers[activeLayerId]) {
                alert('Please select a layer first (click on a layer card)');
                return;
            }
            
            const columnType = selectedOption.dataset.type;
            const columnName = filterColumn.value;
            
            if (columnType === 'number') {
                // Show numeric input and all operators
                filterValue.style.display = 'block';
                filterOperator.innerHTML = `
                    <option value=">=">&gt;=</option>
                    <option value="<=">&lt;=</option>
                    <option value="=">=</option>
                    <option value=">">&gt;</option>
                    <option value="<">&lt;</option>
                `;
            } else if (columnType === 'string') {
                // Show dropdown with unique values and only "=" operator
                filterValueSelect.style.display = 'block';
                filterOperator.innerHTML = `<option value="=">=</option>`;
                
                // Populate unique values from the active layer's original data
                const layer = layers[activeLayerId];
                const uniqueValues = new Set();
                
                // Make sure we have the data
                if (!layer.originalData || !layer.originalData.features) {
                    console.error('No data available for layer', activeLayerId);
                    return;
                }
                
                layer.originalData.features.forEach(feature => {
                    const value = feature.properties[columnName];
                    if (value !== null && value !== undefined) {
                        uniqueValues.add(value);
                    }
                });
                
                filterValueSelect.innerHTML = '<option value="">-- Select Value --</option>';
                Array.from(uniqueValues).sort().forEach(value => {
                    const option = document.createElement('option');
                    option.value = value;
                    option.textContent = value;
                    filterValueSelect.appendChild(option);
                });
            } else {
                // For other types, show text input
                filterValueText.style.display = 'block';
                filterOperator.innerHTML = `<option value="=">=</option>`;
            }
        }
        
        // Apply filter to active layer
        function applyFilter() {
            if (activeLayerId === null) {
                alert('Please select a layer first (click on it)');
                return;
            }
            
            const column = document.getElementById('filterColumn').value;
            const operator = document.getElementById('filterOperator').value;
            const filterValue = document.getElementById('filterValue');
            const filterValueSelect = document.getElementById('filterValueSelect');
            const filterValueText = document.getElementById('filterValueText');
            
            if (!column) {
                alert('Please select a column');
                return;
            }
            
            // Get value based on which input is visible
            let value;
            if (filterValue.style.display !== 'none') {
                value = parseFloat(filterValue.value);
                if (isNaN(value)) {
                    alert('Please enter a valid number');
                    return;
                }
            } else if (filterValueSelect.style.display !== 'none') {
                value = filterValueSelect.value;
                if (!value) {
                    alert('Please select a value');
                    return;
                }
            } else if (filterValueText.style.display !== 'none') {
                value = filterValueText.value;
                if (!value) {
                    alert('Please enter a value');
                    return;
                }
            }
            
            const layer = layers[activeLayerId];
            const selectedOption = document.getElementById('filterColumn').options[document.getElementById('filterColumn').selectedIndex];
            const columnType = selectedOption.dataset.type;
            
            // Store filter criteria for highlighting
            layer.filterColumn = column;
            layer.filterOperator = operator;
            layer.filterValue = value;
            layer.filterColumnType = columnType;
            
            // Keep all features visible, but mark which ones match
            layer.data = layer.originalData; // Show all features
            
            // Count matching features
            let matchCount = 0;
            layer.originalData.features.forEach(feature => {
                const propValue = feature.properties[column];
                let matches = false;
                
                if (columnType === 'number') {
                    const numValue = parseFloat(value);
                    switch(operator) {
                        case '>=': matches = propValue >= numValue; break;
                        case '<=': matches = propValue <= numValue; break;
                        case '=': matches = propValue === numValue; break;
                        case '>': matches = propValue > numValue; break;
                        case '<': matches = propValue < numValue; break;
                        default: matches = true;
                    }
                } else {
                    // String comparison (exact match)
                    matches = propValue === value;
                }
                
                if (matches) matchCount++;
            });
            
            // Mark layer as filtered for highlighting
            layer.isFiltered = true;
            
            createLayer(activeLayerId);
            renderLayerList();
            updateInfo();
            
            // Don't auto-zoom - let user manually zoom to see filtered features
            alert(`Filter applied! Found ${matchCount} matching feature(s).`);
        }
        
        // Reset filter
        function resetFilter() {
            if (activeLayerId === null) return;
            
            document.getElementById('filterColumn').value = '';
            document.getElementById('filterValue').value = '';
            document.getElementById('filterValueSelect').value = '';
            document.getElementById('filterValueText').value = '';
            
            const layer = layers[activeLayerId];
            layer.data = JSON.parse(JSON.stringify(layer.originalData));
            layer.isFiltered = false;
            layer.filterColumn = null;
            layer.filterOperator = null;
            layer.filterValue = null;
            layer.filterColumnType = null;
            
            createLayer(activeLayerId);
            renderLayerList();
            updateInfo();
        }
        
        // Flash filtered features to make them easier to spot
        function flashFilteredFeatures() {
            if (activeLayerId === null) {
                alert('Please select a layer first!');
                return;
            }
            
            const layer = layers[activeLayerId];
            if (!layer.isFiltered) {
                alert('Please apply a filter first!');
                return;
            }
            
            // Count matching features (works with both filter systems)
            let matchCount = 0;
            
            if (layer.filterType === 'multi' && layer.multiFilterResults) {
                // Multi-filter system
                matchCount = layer.multiFilterResults.filter(r => r.matches).length;
            } else if (layer.filterColumn && layer.filterValue !== undefined) {
                // Legacy single filter system
                layer.data.features.forEach(feature => {
                    const propValue = feature.properties[layer.filterColumn];
                    let matches = false;
                    
                    if (layer.filterColumnType === 'number') {
                        const numValue = parseFloat(layer.filterValue);
                        switch(layer.filterOperator) {
                            case '>=': matches = propValue >= numValue; break;
                            case '<=': matches = propValue <= numValue; break;
                            case '=': matches = propValue === numValue; break;
                            case '>': matches = propValue > numValue; break;
                            case '<': matches = propValue < numValue; break;
                        }
                    } else {
                        matches = propValue === layer.filterValue;
                    }
                    
                    if (matches) matchCount++;
                });
            }
            
            if (matchCount === 0) {
                alert('No matching features to flash!');
                return;
            }
            
            // Flash animation using the existing layer flash properties
            // The style function already handles flash colors correctly for filtered features only
            let flashCount = 0;
            const maxFlashes = 6;
            
            const flashInterval = setInterval(() => {
                if (flashCount >= maxFlashes) {
                    // Restore original style - remove flash properties
                    layer.flashColor = null;
                    layer.flashSize = null;
                    
                    // Trigger style refresh by calling the layer's resetStyle if available
                    if (layer.leafletLayer && layer.leafletLayer.resetStyle) {
                        layer.leafletLayer.resetStyle();
                    } else if (layer.leafletLayer && layer.leafletLayer.setStyle) {
                        // Force style recalculation by setting style to a function
                        layer.leafletLayer.setStyle(function(feature) {
                            // Use the same logic from createLayer style function
                            const isHighlighted = layer.isFiltered && (() => {
                                if (layer.filterType === 'multi' && layer.multiFilterResults) {
                                    const featureIndex = layer.data.features.findIndex(f => f === feature);
                                    return featureIndex >= 0 && layer.multiFilterResults[featureIndex]?.matches;
                                } else if (layer.filterColumn && layer.filterValue !== undefined) {
                                    const propValue = feature.properties[layer.filterColumn];
                                    if (layer.filterColumnType === 'number') {
                                        const numValue = parseFloat(layer.filterValue);
                                        switch(layer.filterOperator) {
                                            case '>=': return propValue >= numValue;
                                            case '<=': return propValue <= numValue;
                                            case '=': return propValue === numValue;
                                            case '>': return propValue > numValue;
                                            case '<': return propValue < numValue;
                                        }
                                    } else {
                                        return propValue === layer.filterValue;
                                    }
                                }
                                return false;
                            })();
                            
                            // Return aqua for filtered features, normal color for others
                            const highlightColor = '#00ffff'; // Aqua for filtered features
                            const color = isHighlighted ? highlightColor : layer.config.color;
                            const opacity = isHighlighted ? layer.opacity : layer.opacity * 0.4;
                            const size = layer.config.size || 6;
                            
                            if (feature.geometry.type === 'Point') {
                                return {
                                    radius: size,
                                    fillColor: color,
                                    color: "#333",
                                    weight: 1,
                                    opacity: opacity,
                                    fillOpacity: opacity
                                };
                            } else {
                                return {
                                    fillColor: color,
                                    color: "#333",
                                    weight: 2,
                                    opacity: opacity,
                                    fillOpacity: opacity * 0.7
                                };
                            }
                        });
                    }
                    clearInterval(flashInterval);
                    return;
                }
                
                // Toggle between flash and normal colors
                if (flashCount % 2 === 0) {
                    // Flash on - bright red for filtered features only
                    layer.flashColor = '#ff0000'; // Bright red
                    layer.flashSize = (layer.config.size || 6) + 3;
                } else {
                    // Flash off - back to aqua for filtered features
                    layer.flashColor = null;
                    layer.flashSize = null;
                }
                
                // Trigger style refresh - the style function will handle showing flash color only for filtered features
                if (layer.leafletLayer && layer.leafletLayer.setStyle) {
                    layer.leafletLayer.setStyle(function(feature) {
                        // Use the same logic from createLayer style function
                        const isHighlighted = layer.isFiltered && (() => {
                            if (layer.filterType === 'multi' && layer.multiFilterResults) {
                                const featureIndex = layer.data.features.findIndex(f => f === feature);
                                return featureIndex >= 0 && layer.multiFilterResults[featureIndex]?.matches;
                            } else if (layer.filterColumn && layer.filterValue !== undefined) {
                                const propValue = feature.properties[layer.filterColumn];
                                if (layer.filterColumnType === 'number') {
                                    const numValue = parseFloat(layer.filterValue);
                                    switch(layer.filterOperator) {
                                        case '>=': return propValue >= numValue;
                                        case '<=': return propValue <= numValue;
                                        case '=': return propValue === numValue;
                                        case '>': return propValue > numValue;
                                        case '<': return propValue < numValue;
                                    }
                                } else {
                                    return propValue === layer.filterValue;
                                }
                            }
                            return false;
                        })();
                        
                        // Only apply flash color to filtered features
                        const flashColor = layer.flashColor;
                        const highlightColor = flashColor || '#00ffff'; // Flash color or aqua
                        const color = isHighlighted ? highlightColor : layer.config.color;
                        const opacity = isHighlighted ? layer.opacity : layer.opacity * 0.4;
                        const size = isHighlighted && layer.flashSize ? layer.flashSize : (layer.config.size || 6);
                        
                        if (feature.geometry.type === 'Point') {
                            return {
                                radius: size,
                                fillColor: color,
                                color: "#333",
                                weight: 1,
                                opacity: opacity,
                                fillOpacity: opacity
                            };
                        } else {
                            return {
                                fillColor: color,
                                color: "#333",
                                weight: 2,
                                opacity: opacity,
                                fillOpacity: opacity * 0.7
                            };
                        }
                    });
                }
                
                flashCount++;
            }, 500); // Flash every 500ms
        }
        
        // Fit map to all visible layers
        function fitMapToLayers() {
            const bounds = L.latLngBounds([]);
            let hasFeatures = false;
            
            Object.keys(layers).forEach(layerId => {
                if (layers[layerId].config.visible && layers[layerId].leafletLayer) {
                    const layerBounds = layers[layerId].leafletLayer.getBounds();
                    if (layerBounds.isValid()) {
                        bounds.extend(layerBounds);
                        hasFeatures = true;
                    }
                }
            });
            
            if (hasFeatures) {
                map.fitBounds(bounds);
            }
        }
        
        // Update info bar (minimalistic - hidden)
        function updateInfo() {
            const info = document.getElementById('info');
            // Hide the info bar for minimalistic design
            info.style.display = 'none';
        }
        
        // Add event listener for hide checkbox
        document.addEventListener('DOMContentLoaded', function() {
            const hideCheckbox = document.getElementById('hideNonFiltered');
            if (hideCheckbox) {
                hideCheckbox.addEventListener('change', function() {
                    // Re-render the active layer when checkbox state changes
                    if (activeLayerId !== null && layers[activeLayerId].isFiltered) {
                        createLayer(activeLayerId);
                        updateInfo();
                    }
                });
            }
        });
    </script>
